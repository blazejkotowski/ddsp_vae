# Realtime morelli recipe — same params as harmsworth_rt_cb256 (rsf=128,
# compression 16, codebook 256, full prior d_model 256 / 4 layers / max_len 128),
# applied to the morelli dataset.
#
# Root-cause fix for the realtime problem: the original harmsworth_stereo.yaml uses
# resampling_factor=32 -> 1500 Hz control rate -> 93.75 tokens/s -> 10.7 ms/token
# budget, which the AR prior (no KV cache) can't meet on the deployment CPU. The
# trains_48kHz_stereo model runs fine because it sits at ~23 tokens/s (42.7 ms
# budget). We match that budget here while keeping a finer control rate than trains:
#
#   resampling_factor 128  -> control rate 48000/128 = 375 Hz   (trains: 187.5)
#   compressor comp 16     -> token rate  375/16     = 23.4 / s  (== trains)
#   budget                 -> 1000/23.4              = 42.7 ms / token
#
# With this budget the FULL-capacity prior (d_model 256, 4 layers) is realtime at
# max_len 128 (rtf_full ~6, matching the trains model's proven real-world margin),
# so we keep accuracy high instead of shrinking the network (the sweep in
# experiments/prior_speed/ showed shrinking d_model/layers wrecks token accuracy;
# context length is nearly free). Codebook stays 64 (not trains' 512): smaller prior
# output projection, easier next-token prediction, proven control reconstruction.

experiment:
  name: morelli_rt
  training_dir: training

audio:
  fs: 48000
  chunk_duration_s: 2.0
  n_channels: 2

data:
  dataset_path: /mnt/mariadata/datasets/beat-artists/morelli/processed-stereo
  augmentations:
    - type: RandomMute
      params:
        prob: 0.1

model:
  resampling_factor: 128   # was 32; 375 Hz control rate -> 4x lower token rate
  control_space:
    - name: loudness
      dim: 1
      source: feature
      extractor: LibrosaFeatureExtractor
      params:
        feature_fn_name: rms
        smoothing_kernel_size: 1
        postprocess: true
    - name: centroid
      dim: 1
      source: feature
      extractor: LibrosaFeatureExtractor
      params:
        feature_fn_name: spectral_centroid
        smoothing_kernel_size: 1
        postprocess: true
    - name: latents
      dim: 2
      source: latent
  synths:
    - type: BendableNoiseBandSynth
      params:
        n_filters: 1000
  latent_smoothing_kernel: 1
  decoder_gru_layers: 2
  decoder_temporal_stride: 4
  learning_rate: 1e-4
  plateau_patience: 15000
  capacity: 24
  beta:
    target: 0.001     # target β for the β-VAE KLD term
    start_epoch: 30   # hold β at 0 until this epoch
    end_epoch: 50     # linearly ramp β to target by this epoch

losses:
  - type: MRSTFT
    weight: 1.0
    params:
      fft_sizes: [2053, 1021, 509, 257, 129, 65, 33]

adversarial:
  enabled: false
  weights:
    gen: 0.01
    disc: 0.01
    fm: 0.01
  schedule:
    g_start_epoch: 50
    d_start_epoch: 60

trainer:
  batch_size: 6
  max_epochs: 100
  log_every_n_steps: 10
  force_restart: false

prior:
  enabled: true

  discrete:
    enabled: true
    compressor_ckpt: null

  model:
    embedding_dim: 64       # d_model = 64*4 = 256 (full capacity, kept for accuracy)
    nhead: 8                # 256 / 8 = 32
    num_layers: 4
    dim_feedforward: 1024
    dropout: 0.0
    max_len: 128            # ~5.5s of context at 23.4 Hz tokens; realtime w/ ~6x margin

  dataset:
    stride_factor: 0.01
    in_memory: true

  training:
    batch_size: 256
    max_epochs: 10000
    num_workers: 4
    lr: 5e-4
    force_restart: false
    val_fraction: 0.00
    split_strategy: blocked_random
    split_gap: null
    split_seed: 0

# Compressor: 16x over the 375 Hz control sequence -> 23.4 Hz tokens.
compressor:
  force_restart: false
  hidden_dim: 64
  compressed_dim: 16
  strides: [4, 2, 2]        # product 16
  stride_factor: 0.5
  num_residual_layers: 2
  kernel_size: 5
  max_channels: 448
  use_skip_connections: false # required for codes-only (AR-prior-compatible) decoding

  vq:
    enabled: true
    num_codebooks: 4
    codebook_size: 256
    beta: 0.25
    loss_weight: 0.2

  batch_size: 32
  max_epochs: 250
  learning_rate: 1e-4
  num_workers: 0
