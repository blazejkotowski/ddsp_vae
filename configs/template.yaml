# ============================================================================================
# TEMPLATE config for a DDSP-VAE synth + grouped-VQ codec + discrete STYLE prior (nn~ instrument).
#
# Pipeline (3 stages, each reads this one file):
#   1. python -m cli.train        -cn <name>           -> trains the SYNTH (sections: audio / data /
#                                                          model / losses / adversarial / trainer)
#   2. python -m cli.train_prior  -cn <name>           -> trains the CODEC (compressor) then the
#                                                          PRIOR                (sections: prior / compressor)
#   3. python -m cli.export       --config <name>      -> models/<name>.ts for Max/MSP (nn~)
#
# Copy this file to configs/<name>.yaml, set `experiment.name` + `data.dataset_path`, adjust as noted.
# Everything UNCOMMENTED below is a complete, ready-to-train config (a realtime style + LFO recipe:
# β-VAE latents, learned style encoder, k-means territories, cond-envelope prior). Everything
# COMMENTED-OUT is optional — uncomment to enable (each has a note).
# See DISCRETE_PRIOR.md for the architecture and the full nn~ control layout.
#
# Overriding on the CLI (Hydra): `++section.key=value` overrides an existing key, `+section.key=value`
# adds a new one. Example: python -m cli.train -cn <name> data.dataset_path=/abs/path ++trainer.batch_size=8
# ============================================================================================

experiment:
  name: my_model                 # all artifacts go under training/{synth,compressor,prior_discrete}/<name>
  training_dir: training         # root output dir

# ── audio / dataset ─────────────────────────────────────────────────────────────────────────
audio:
  fs: 48000                      # sample rate (must match your wavs; resample beforehand otherwise)
  chunk_duration_s: 2.0          # training chunk length for the SYNTH (seconds)
  n_channels: 2                  # 1 = mono, 2 = stereo

data:
  dataset_path: /path/to/your/audio   # dir of .wav files (globbed **/*.wav)

  # Waveform augmentations applied during SYNTH training (registry-driven).
  # Types: RandomMute, RandomGain, RandomCompress, RandomPitch, RandomCrop.
  augmentations:
    - type: RandomMute
      params:
        prob: 0.1                # randomly silence a fraction of frames (robustness)

  # TIP: per-track loudness-normalise a multi-style dataset (e.g. RMS ~0.1) before training, or the
  #      loudest tracks dominate the MRSTFT loss and quiet styles reconstruct poorly.

# ── SYNTH (DDSP-VAE): audio <-> control trajectory ────────────────────────────────────────────
model:
  resampling_factor: 128         # control rate = fs / resampling_factor (48000/128 = 375 Hz).
                                 #   Lower = finer control (more compute); this + the codec set the
                                 #   final token rate (see compressor.strides).
  control_space:                 # the per-frame control vector the prior ultimately generates.
    - name: loudness             #   ch 0 — RMS loudness (carries dynamics/groove)
      dim: 1
      source: feature
      extractor: LibrosaFeatureExtractor
      params: { feature_fn_name: rms, smoothing_kernel_size: 1, postprocess: true }
    - name: centroid             #   ch 1 — spectral centroid (brightness)
      dim: 1
      source: feature
      extractor: LibrosaFeatureExtractor
      params: { feature_fn_name: spectral_centroid, smoothing_kernel_size: 1, postprocess: true }
    - name: latents              #   ch 2..3 — VAE latents (timbre); dim = latent_size
      dim: 2
      source: latent
  synths:
    - type: BendableNoiseBandSynth   # the noise-band synth; cheap + realtime.
      params:                        #   Others (registry): SineSynth, NoiseBandSynth, SubbandSineSynth,
        n_filters: 1000              #   HarmonicSynth. Multiple synths listed here SUM their outputs.
                                     #   n_filters = number of noise bands (more = finer spectra, more compute)
  latent_smoothing_kernel: 1     # temporal smoothing of latents (1 = off)
  decoder_gru_layers: 2          # decoder recurrence depth
  decoder_temporal_stride: 4     # decoder runs at control_rate/stride then LINEAR-upsamples
                                 #   (linear, not zero-order-hold — avoids upsampling clicks; keep ≥2)
  learning_rate: 1e-4
  min_lr: 0.0                    # generator LR floor. Set >0 (e.g. 5e-5) when using adversarial: the
                                 #   plateau scheduler otherwise decays LR to ~1e-8 by convergence and
                                 #   the generator is frozen once the adversarial phase starts.
  plateau_patience: 15000        # LR plateau scheduler patience (steps)
  capacity: 24                   # VAE bottleneck capacity (latent expressivity)

  # β-VAE KLD warmup (regularises the latent space). Gently anneals β from 0 to `target` between
  # the two epochs. Remove the whole block to disable (β stays 0).
  beta:
    target: 0.001                #   final β
    start_epoch: 30              #   hold β=0 until here
    end_epoch: 50                #   linearly ramp to target by here

losses:                          # SYNTH reconstruction loss (registry-driven; MRSTFT is the default)
  - type: MRSTFT
    weight: 1.0
    params:
      fft_sizes: [2053, 1021, 509, 257, 129, 65, 33]

# ── adversarial GAN fine-tuning of the synth (optional feature; keep `enabled: false` to skip) ──
# NOTE: the `schedule` and `weights` blocks are read even when disabled, so keep them present.
adversarial:
  enabled: false
  weights: { gen: 0.1, disc: 1.0, fm: 1.0 }   # feature-matching (fm) is the stable, reconstruction-like
                                              #   workhorse; keep the hinge (gen) small so recons dominates.
  schedule: { d_start_epoch: 70, g_start_epoch: 78 }   # D must warm up BEFORE G (a generator chasing an
                                              #   untrained D only hurts); both start after recons converges.
                                              #   When enabling, also set model.min_lr (e.g. 5e-5) so G isn't frozen.
  # ndf: 16                      # (optional) discriminator first-layer filters; a real critic (default 4 is weak)
  # disc_update_every: 1         # (optional) train D every Nth batch (1 = every step; default 5)

trainer:                         # SYNTH training loop
  batch_size: 6
  max_epochs: 100
  log_every_n_steps: 10
  force_restart: false           # true = ignore existing checkpoint and train from scratch

# ── PRIOR + CODEC ─────────────────────────────────────────────────────────────────────────────
# This template configures the DISCRETE codec prior (the nn~ style instrument). For the simpler CONTINUOUS
# mu-law prior instead, set `discrete.enabled: false` and use `prior.model` mu-law keys
# (embedding_dim / quantization_channels / nhead / num_layers / dim_feedforward / dropout / max_len);
# see configs/experiment.yaml for a full continuous example. The `compressor` section is then unused.
prior:
  enabled: true

  discrete:
    enabled: true
    # compressor_ckpt: null      # OPTIONAL — path to a pre-trained codec; default (omitted/null) auto-
                                 #   trains/locates one under training/compressor/<name>.

    # ── learned STYLE encoder (the headline steering; becomes the XY pad at play time) ──
    style_dim: 64                # >0 enables the StyleEncoder + the style XY pad. 0 = no style.
    style_dropout: 0.2           # zero `s` sometimes -> a learned null style => Style-CFG capable
    style_aux_weight: 0.3        # aux head classifies the source track from `s` -> separable styles
                                 #   (pad zones become distinct). Uses the per-track territory labels.

    # ── TERRITORY conditioning (a second, discrete steering: the territory XY pad + territory-CFG) ──
    num_territories: 4           # number of steerable zones (k-means over control descriptors); 0 = off
    terr_by_track: false         # false = k-means clusters (territories are DECOUPLED from track count);
                                 #   true = one territory per source track (needs many tracks)
    terr_rich: true              # rich descriptor for the k-means clustering
    terr_map_temp: 0.5           # territory-map blend sharpness for the exported XY pad
    cfg_dropout: 0.15            # train a null-territory row => territory classifier-free guidance.
                                 #   (Style-CFG uses style_dropout instead.) Keep >0 to allow CFG.

    # ── generation robustness (keep dynamics + groove at free-running) ──
    context_dropout: 0.0         # corrupt this fraction of context tokens (forces reliance on `s`).
                                 #   0 preserves loudness dynamics; >0 makes style stronger but COMPRESSES
                                 #   loudness dynamics. Leave 0 unless style won't steer.
    ss_prob: 0.3                 # scheduled sampling: train on the model's OWN sampled context
    ss_iters: 3                  # >1 = iterate the re-sampling so the context carries realistic
                                 #   multi-step drift (stops free-run dynamics from flattening)
    ss_anneal_steps: 4000        # ramp ss_prob 0 -> target over this many steps (warmup)
    ss_temperature: 1.0          # sampling temperature used when drawing those context tokens

    joint_codebooks: true        # depth head: sample the 4 codebooks jointly (on-manifold; kills the
                                 #   codebook-independence clicks). Keep true.
    decode_lookahead: 2          # streaming-decode lookahead (tokens of latency in nn~)

    # ── LFO / cond envelope (slow scaffold the prior can follow; drives "LFO 1..4" in nn~) ──
    cond_envelope: true          # add the low-passed control envelope as conditioning
    cond_smooth_frames: 64       # envelope low-pass window (control frames)
    cond_dropout: 0.5            # zero the envelope for this fraction of windows -> the model also learns
                                 #   FREEFORM (cond=0); feed 0 to the LFO inputs at play time.

  model:                         # the prior Transformer
    embedding_dim: 64            # d_model = embedding_dim × num_codebooks (64×4 = 256)
    nhead: 8                     # attention heads (d_model must divide by nhead)
    num_layers: 4
    dim_feedforward: 1024
    dropout: 0.0
    max_len: 256                 # context length in TOKENS (≈ max_len / token_rate seconds)

  dataset:                       # prior token-window dataset
    stride_factor: 0.004         # window hop as a fraction of max_len (smaller = more windows)
    respect_boundaries: true     # never build windows that cross a track boundary
    in_memory: true              # cache token windows in RAM (faster; needs enough memory)

  training:                      # prior training loop
    batch_size: 64
    max_epochs: 10000            # effectively unbounded; max_steps is the real stop
    max_steps: 50000             # STOP here. ~50k is the sweet spot (more overtrains -> regresses
                                 #   groove/reach). last.ckpt = this step = what export ships.
                                 #   (PRIOR_MAX_STEPS env var overrides this for ad-hoc runs.)
    num_workers: 4
    lr: 5e-4
    force_restart: false
    val_fraction: 0.0            # held-out fraction (0 = none; val acc is noisy on tiny sets)
    split_strategy: blocked_random
    split_gap: null
    split_seed: 0

# ── CODEC (LatentCompressor: grouped-VQ over the control sequence) ─────────────────────────────
# Trained automatically by cli/train_prior.py before the prior (when prior.discrete.enabled=true).
compressor:
  force_restart: false
  hidden_dim: 64
  compressed_dim: 16             # VQ bottleneck width (timbral fidelity per token; raise for richer
                                 #   tokens, but it's the main fidelity bottleneck — not codebook_size)
  strides: [4, 2, 2]             # TOKEN RATE = control_rate / product(strides).  [4,2,2]=16 ->
                                 #   375/16 = 23.4 Hz (≈43 ms/token) -> ~12 tokens/beat at 125 bpm.
                                 #   ⚠ USE THIS for rhythmic material. A coarse [5,5,3]=75 (~200 ms)
                                 #   captures whole drum hits but is sub-Nyquist for the beat, so the
                                 #   prior CANNOT generate a stable groove ("groove comes and goes").
  stride_factor: 0.5
  num_residual_layers: 2
  kernel_size: 5
  max_channels: 448
  use_skip_connections: false    # MUST be false: codes-only decoding (the prior generates codes only)

  vq:
    enabled: true
    num_codebooks: 4             # grouped VQ: N indices per token (the prior's per-step "depth")
    codebook_size: 256           # entries per codebook
    beta: 0.25                   # commitment loss weight
    loss_weight: 0.2             # VQ loss weight in the codec objective

  batch_size: 32
  max_epochs: 250
  learning_rate: 1e-4
  num_workers: 0

# ── POST-NET (optional) ───────────────────────────────────────────────────────────────────────
# Faithful streaming enhancer applied AFTER the synth, exposed live as the `postnet_mix` knob (sharper
# transients, corrected spectral envelope). OPTIONAL and off by default. Train it as its own stage —
# `python -m cli.train_postnet -cn <name> ++postnet.enabled=true` — after the synth is trained; it
# writes to training/postnet/<name>/ and cli.export picks it up automatically. `cond_dim` is derived
# from the model (feature_dim + latent_size), so it is intentionally not set here.
postnet:
  enabled: false
  model:
    ch: 128                        # stage-1 conv width
    layers: 10                     # stage-1 dilated blocks
    ch2: 96                        # stage-2 (fine) conv width
    layers2: 8                     # stage-2 dilated blocks
    max_gain_db: 15.0              # per-bin gain bound; TIGHTER = leans harder on the rough (bends
                                   #   transmit better) at a small reconstruction cost
    phase_cap: 1.57                # per-bin phase-nudge cap (radians, ~π/2)
    la_f: 3                        # look-ahead frames (quality vs latency)
  data:
    chunk_s: 1.0                   # training window length (s)
    hop_s: 0.25                    # dense-window hop (s) — smaller = more (overlapping) training data
  training:
    max_steps: 18000               # real stop (POSTNET_MAX_STEPS env overrides)
    batch_size: 16
    lr: 3.0e-4
    bend_aug_p: 0.4                # prob. of applying a shared spectral bend to rough+target (teaches
                                   #   bend preservation)
    gain_slew_w: 0.5               # penalty on frame-to-frame gain jumps (click-free gains)
    ema: 0.999                     # EMA decay for the saved weights (0 disables)
    val_fraction: 0.1              # tail of the timeline held out for val_mrstft
    force_restart: false
