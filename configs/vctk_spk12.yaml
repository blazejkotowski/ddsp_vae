# VCTK speaker-conditioned prior: 12 speakers (6F/6M, ages spread), each a concatenated mono 48kHz
# file = one TERRITORY. Built by scripts/build_vctk_dataset.py (per-utterance silence trim + anti-click
# fades + per-speaker RMS-0.1 norm). Synth + compressor train FRESH (speech timbres). 12 territories is a
# light load, so the small prior (d_model 256 / 4 layers) is sufficient and keeps RTF headroom.

experiment:
  name: vctk_spk12
  training_dir: training

audio:
  fs: 48000
  chunk_duration_s: 2.0
  n_channels: 1

data:
  dataset_path: /mnt/mariadata/datasets/vctk-spk12/processed-mono
  augmentations:
    - type: RandomMute
      params:
        prob: 0.1

model:
  resampling_factor: 128
  control_space:
    - name: loudness
      dim: 1
      source: feature
      extractor: LibrosaFeatureExtractor
      params:
        feature_fn_name: rms
        smoothing_kernel_size: 1
        postprocess: true
    - name: centroid
      dim: 1
      source: feature
      extractor: LibrosaFeatureExtractor
      params:
        feature_fn_name: spectral_centroid
        smoothing_kernel_size: 1
        postprocess: true
    - name: latents
      dim: 2
      source: latent
  synths:
    - type: BendableNoiseBandSynth
      params:
        n_filters: 1000
  latent_smoothing_kernel: 1
  decoder_gru_layers: 2
  decoder_temporal_stride: 4
  learning_rate: 1e-4
  plateau_patience: 15000
  capacity: 24
  beta:
    target: 0.001
    start_epoch: 30
    end_epoch: 50

losses:
  - type: MRSTFT
    weight: 1.0
    params:
      fft_sizes: [2053, 1021, 509, 257, 129, 65, 33]

adversarial:
  enabled: false
  weights:
    gen: 0.01
    disc: 0.01
    fm: 0.01
  schedule:
    g_start_epoch: 50
    d_start_epoch: 60

trainer:
  batch_size: 6
  max_epochs: 100
  log_every_n_steps: 10
  force_restart: false

prior:
  enabled: true

  discrete:
    enabled: true
    compressor_ckpt: null
    cond_envelope: true
    cond_smooth_frames: 64
    cfg_dropout: 0.15
    cond_dropout: 0.5
    joint_codebooks: true
    terr_rich: true
    terr_by_track: true
    num_territories: 12
    # ── learned style encoder (XY pad at play time; complements speaker territory) ──
    style_dim: 64
    style_dropout: 0.2
    style_aux_weight: 0.3      # speaker-classification aux on `s` -> separable speaker style space
    # ── generation robustness ──
    context_dropout: 0.0
    ss_prob: 0.3
    ss_iters: 3
    ss_anneal_steps: 4000
    ss_temperature: 1.0

  model:
    embedding_dim: 96           # d_model = 96*4 = 384 (14.8M: speech needs more capacity than music loops)
    nhead: 8                    # 384/8 = 48 per head
    num_layers: 6
    dim_feedforward: 2048
    dropout: 0.0
    max_len: 256

  dataset:
    stride_factor: 0.01         # 2-token hop; speakers are long (~15-25min) so plenty of windows
    respect_boundaries: true
    in_memory: true

  training:
    batch_size: 64
    max_epochs: 10000
    max_steps: 200000           # speech is high-entropy + was still climbing at 50k; longer horizon
    num_workers: 4
    lr: 5e-4
    force_restart: false
    val_fraction: 0.01
    split_strategy: blocked_random
    split_gap: null
    split_seed: 0

compressor:
  force_restart: false
  hidden_dim: 64
  compressed_dim: 16
  strides: [4, 2, 2]
  stride_factor: 0.5
  num_residual_layers: 2
  kernel_size: 5
  max_channels: 448
  use_skip_connections: false

  vq:
    enabled: true
    num_codebooks: 4
    codebook_size: 256
    beta: 0.25
    loss_weight: 0.2

  batch_size: 32
  max_epochs: 250
  learning_rate: 1e-4
  num_workers: 0
