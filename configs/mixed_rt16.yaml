# Mixed morelli+harmsworth with a LEARNED STYLE ENCODER (the "much more powerful way to
# delimit styles" than the 12 weak territory labels). On top of mixed_norm: a continuous,
# bottlenecked global style code `s` is encoded from each window's tokens and injected at every
# position (+ FiLM), trained jointly with the prior. With the explicit LFO/cond present, the LFO
# "explains away" the slow envelope, so `s` is pushed to carry the residual texture/rhythm/identity
# — i.e. style is the LFO-COMPLEMENT. At inference we extract `s` from a reference window (priming
# by style, not by token continuation) and can style-CFG it for strength.
#
# Reuses the mixed_norm SYNTH + COMPRESSOR unchanged (style is a prior-only feature); only the
# prior retrains fresh. Symlink before training:
#   training/synth/mixed_style      -> mixed_norm
#   training/compressor/mixed_style -> mixed_norm
# Expects LOUDNESS-NORMALIZED input (RMS ~0.1), same as mixed_norm.

experiment:
  name: mixed_rt16
  training_dir: training

audio:
  fs: 48000
  chunk_duration_s: 2.0
  n_channels: 2

data:
  dataset_path: /mnt/mariadata/datasets/mixed-norm/processed-stereo
  augmentations:
    - type: RandomMute
      params:
        prob: 0.1

model:
  resampling_factor: 128
  control_space:
    - name: loudness
      dim: 1
      source: feature
      extractor: LibrosaFeatureExtractor
      params:
        feature_fn_name: rms
        smoothing_kernel_size: 1
        postprocess: true
    - name: centroid
      dim: 1
      source: feature
      extractor: LibrosaFeatureExtractor
      params:
        feature_fn_name: spectral_centroid
        smoothing_kernel_size: 1
        postprocess: true
    - name: latents
      dim: 2
      source: latent
  synths:
    - type: BendableNoiseBandSynth
      params:
        n_filters: 1000
  latent_smoothing_kernel: 1
  decoder_gru_layers: 2
  decoder_temporal_stride: 4
  learning_rate: 1e-4
  plateau_patience: 15000
  capacity: 24
  beta:
    target: 0.001
    start_epoch: 30
    end_epoch: 50

losses:
  - type: MRSTFT
    weight: 1.0
    params:
      fft_sizes: [2053, 1021, 509, 257, 129, 65, 33]

adversarial:
  enabled: false
  weights:
    gen: 0.01
    disc: 0.01
    fm: 0.01
  schedule:
    g_start_epoch: 50
    d_start_epoch: 60

trainer:
  batch_size: 6
  max_epochs: 100
  log_every_n_steps: 10
  force_restart: false

prior:
  enabled: true

  discrete:
    enabled: true
    compressor_ckpt: null
    cond_envelope: true
    cond_smooth_frames: 64
    cfg_dropout: 0.15
    cond_dropout: 0.5
    joint_codebooks: true
    terr_rich: true
    terr_by_track: true
    num_territories: 12
    # ── learned style encoder (the main steering; XY pad at play time) ──
    style_dim: 64            # >0 enables the StyleEncoder + style XY pad
    style_dropout: 0.2       # zeros `s` sometimes -> a clean null for style-CFG at inference
    style_aux_weight: 0.3    # track-classification aux on `s` -> separable style space
    # ── generation robustness ──
    context_dropout: 0.0     # 0: keep loudness dynamics (>0 forces style reliance but compresses them)
    ss_prob: 0.3             # iterated scheduled sampling: train on the model's own drifted context
    ss_iters: 3              # >1 = multi-step drift (keeps free-running dynamics from flattening)
    ss_anneal_steps: 4000    # ramp ss_prob 0 -> target
    ss_temperature: 1.0

  model:
    embedding_dim: 64
    nhead: 8
    num_layers: 4
    dim_feedforward: 1024
    dropout: 0.0
    max_len: 256

  dataset:
    stride_factor: 0.004
    respect_boundaries: true
    in_memory: true

  training:
    batch_size: 64
    max_epochs: 10000
    num_workers: 4
    lr: 5e-4
    force_restart: false
    val_fraction: 0.00
    split_strategy: blocked_random
    split_gap: null
    split_seed: 0

compressor:
  force_restart: false
  hidden_dim: 64
  compressed_dim: 16
  strides: [4, 2, 2]
  stride_factor: 0.5
  num_residual_layers: 2
  kernel_size: 5
  max_channels: 448
  use_skip_connections: false

  vq:
    enabled: true
    num_codebooks: 4
    codebook_size: 256
    beta: 0.25
    loss_weight: 0.2

  batch_size: 32
  max_epochs: 250
  learning_rate: 1e-4
  num_workers: 0
